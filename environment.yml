# ss_openblas -- the project's Python environment (since T14, 2026-10-14).
#
# Why OpenBLAS: Apple Accelerate's ddot (np.dot / np.linalg.norm on 1-D
# float64) returns results whose last bits depend on the input buffer's
# memory alignment, so scipy.optimize.least_squares -- and therefore the comb
# fit -- was not bit-reproducible run to run, even inside one process.
# OpenBLAS's kernels are alignment-independent. Evidence:
# reports/2026-10-14_t14-bit-reproducible-scorecards/.
# BLAS threads are pinned to 1 per process in code (claude_files/determinism.py),
# not here.
#
# ---------------------------------------------------------------------------
# HOW IT WAS BUILT on macOS x86_64 (Intel i5-1038NG7, macOS 15), 2026-10-14
# ---------------------------------------------------------------------------
# PyPI's macOS x86_64 numpy 1.26.4 wheel bundles OpenBLAS, but scipy 1.16.0
# ships TWO x86_64 wheels -- macosx_10_14 (OpenBLAS) and macosx_14_0
# (Accelerate) -- and pip on macOS >= 14 picks the Accelerate one. So scipy is
# installed from the explicitly downloaded OpenBLAS wheel:
#
#   conda create -n ss_openblas python=3.12 pip
#   conda run -n ss_openblas pip download scipy==1.16.0 --platform macosx_10_14_x86_64 \
#       --python-version 3.12 --implementation cp --only-binary=:all: --no-deps -d /tmp/ssw
#   conda run -n ss_openblas pip install numpy==1.26.4 /tmp/ssw/scipy-1.16.0-cp312-cp312-macosx_10_14_x86_64.whl
#   conda env update -n ss_openblas -f environment.yml      # the pinned rest, below
#   conda run -n ss_openblas python -m ipykernel install --user --name ss_openblas --display-name "Python (ss_openblas)"
#
# (`conda env create -f environment.yml` alone would install scipy from PyPI
# and get the Accelerate wheel on macOS >= 14 -- do the steps above.)
#
# Verify after building (must say openblas for BOTH numpy and scipy, and the
# determinism test must PASS, not XFAIL):
#   python -c "import numpy, scipy.linalg, threadpoolctl; print(threadpoolctl.threadpool_info())"
#   python -m pytest -q tests/test_determinism.py
#
# APPLE SILICON (arm64) WARNING: numpy's and scipy's macOS arm64 PyPI wheels
# use Accelerate, so the pip route brings the non-determinism back. On arm64
# use conda-forge with `libblas=*=*openblas` instead (ideally via mamba /
# micromamba; conda 4.10's classic solver took >12 min without finishing on
# this machine), then re-verify determinism with the commands above.
#
# numpy/scipy are pinned to the versions the old ss_local env used, so the
# only difference from ss_local is the BLAS backend (python is 3.12 because
# numpy 1.26 has no 3.13 wheels). contourpy is held < 1.4 because 1.4 needs
# numpy >= 2.
name: ss_openblas
channels:
  - defaults
dependencies:
  - python=3.12.11
  - pip
  - pip:
      - numpy==1.26.4
      # scipy==1.16.0 -- install the macosx_10_14_x86_64 (OpenBLAS) wheel by hand, see above
      - pandas==2.3.1
      - astropy==7.1.0
      - matplotlib==3.10.3
      - contourpy==1.3.3
      - lmfit==1.3.4
      - pytest==9.1.1
      - threadpoolctl==3.7.0
      - ipykernel==7.4.0
      - nbformat==5.11.1
      - nbclient==0.11.0
      - nbconvert==7.17.2
